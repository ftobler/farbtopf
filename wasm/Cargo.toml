[package]
name = "farbtopf-algo"
description = "Image algorithms for Farbtopf, compiled to WebAssembly"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Standalone: not part of any parent workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

# No dependencies on purpose: the module is built from the code in this directory alone.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
