<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Farbtopf — a tiny paint pot for your browser. A fast MS Paint style editor for annotating and editing images."
    />
    <meta name="theme-color" content="#0b6fce" />
    <title>Farbtopf</title>
    <script>
      try {
        var stored = localStorage.getItem('farbtopf:theme')
        if (stored !== 'light' && stored !== 'dark') {
          stored = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = stored
      } catch (error) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
